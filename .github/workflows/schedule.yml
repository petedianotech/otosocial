name: Scheduled Publishing

on:
  schedule:
    # Run at requested times (e.g., 6:00, 10:00, 13:00, 18:00 UTC)
    - cron: '0 6,10,13,18 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  ping_endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the webhook URL
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "Error: TARGET_URL secret is not set!"
            echo "Please set TARGET_URL to your deployed application URL (e.g., https://peterdamiano.vercel.app/api/generate)"
            exit 1
          fi
          
          curl -X POST -H "Content-Type: application/json" $TARGET_URL
